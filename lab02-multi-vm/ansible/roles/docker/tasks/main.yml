# ================================================
# ROLE : Docker
# Objectif : Installer docker dans un serveur
# ================================================
---

- name: Mettre à jour la liste des paquets
  apt:
    update_cache: true
  
- name: Installer Docker
  apt:
    name: docker.io 
    state: present
    update_cache: true

- name: Démarrer Docker
  service:  
    name: docker
    state: started
    enabled: true

- name: Ajouter vagrant au groupe docker
  user:
    name: vagrant
    groups: docker
    append: true

- name: Afficher un message de confirmation
  debug:
    msg: "✅ {{ inventory_hostname }} configuré avec le role Docker"
