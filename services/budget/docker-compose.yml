services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budget-backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    command: sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -'
    restart: always

  redis:
    image: redis:7-alpine
    container_name: budget-redis
    restart: always
    volumes:
      - redis_data:/data

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budget-celery
    env_file: .env
    volumes:
      - media_files:/app/media
    depends_on:
      - backend
      - redis
    command: sh -c 'celery -A config worker --loglevel=info --concurrency=2'
    restart: always

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budget-celery-beat
    env_file: .env
    volumes:
      - media_files:/app/media
    depends_on:
      - backend
      - redis
    command: sh -c 'celery -A config beat --loglevel=info -s /tmp/celerybeat-schedule'
    restart: always

volumes:
  media_files:
  static_files:
  redis_data:
